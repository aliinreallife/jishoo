name: Production health
on:
  deployment_status:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  public-checks:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check canonical production site without creating accounts
        run: python scripts/check_production.py
