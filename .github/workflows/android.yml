name: Build Jishoo Android TWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'public/manifest.webmanifest', 'public/assets/app-icon-*.png', 'scripts/sync_android.mjs', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JISHOO_ANDROID_VERSION_CODE: ${{ github.run_number }}
      JISHOO_ANDROID_VERSION_NAME: '1.0.${{ github.run_number }}'
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare optional release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jishoo-release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/jishoo-release.jks" >> "$GITHUB_ENV"
      - name: Sync branding from the PWA manifest
        run: node scripts/sync_android.mjs
      - name: Build installable debug APK and release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon :app:assembleDebug :app:bundleRelease :app:assembleRelease
      - name: Write build notes
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/debug/*.apk android-artifacts/
          cp android/app/build/outputs/apk/release/*.apk android-artifacts/
          cp android/app/build/outputs/bundle/release/*.aab android-artifacts/
          if [ "$HAS_RELEASE_SIGNING" = true ]; then
            printf 'Release signing configured. Publish the SHA-256 app-signing certificate in ANDROID_SHA256_CERTIFICATES on Vercel.\n' > android-artifacts/README.txt
          else
            printf 'Debug APK is installable for testing. Release APK/AAB are unsigned. Add the Android signing secrets described in android/README.md before distribution. Chrome shows its toolbar until Digital Asset Links matches the installed signing certificate.\n' > android-artifacts/README.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jishoo-android-${{ github.run_number }}
          path: android-artifacts/
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/jishoo-release.jks"
