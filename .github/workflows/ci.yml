name: App checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt
      - name: Validate GitHub workflows
        run: python scripts/check_workflows.py
      - run: npm ci --no-audit --no-fund
      - name: Unit, privacy and security regressions
        run: npm test
      - name: Production build
        run: npm run build
      - name: Initial download budgets
        run: npm run check:bundle
      - name: Install browser test tools
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Navigation, signup, maps, forms and story exports
        run: npm run test:browser
      - name: Save synthetic screenshots and size report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-checks-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
