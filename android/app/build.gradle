plugins { id 'com.android.application' }
def siteOrigin = System.getenv('JISHOO_ANDROID_ORIGIN') ?: 'https://jishoo.vercel.app'
def siteHost = new URI(siteOrigin).host
android {
    namespace 'app.jishoo.twa'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'app.jishoo.twa'
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('JISHOO_ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('JISHOO_ANDROID_VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders = [siteHost: siteHost, launchUrl: siteOrigin + '/home?source=twa']
        resValue 'string', 'asset_statements', '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"' + siteOrigin + '"}}]'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2' }
